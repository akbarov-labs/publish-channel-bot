[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Delivers the "post published" webhook to the bot (App\Jobs\PublishToTelegram)
; so publishing in the admin never waits on Telegram. As www-data, like
; php-fpm, so what it writes under storage/ stays writable by the app.
; --max-time restarts it hourly, which keeps a slow leak from growing.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --sleep=1 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
