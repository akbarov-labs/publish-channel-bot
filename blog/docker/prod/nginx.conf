server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Telegram media arrives from the bot up to 20 MB.
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Media uploaded by the bot and the admin. Never executed, and a browser
    # is told to treat the bytes as the declared type: an image parsed as
    # HTML would be stored XSS on the admin's origin. The reader site loads
    # these cross-origin, which plain <img> tags allow.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        location ~ \.(php|phar|phtml|php\d*)$ {
            deny all;
        }

        try_files $uri =404;
    }

    location ~ \.php$ {
        # Only scripts that literally exist reach PHP-FPM, so an upload named
        # photo.jpg/x.php can never be run.
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
