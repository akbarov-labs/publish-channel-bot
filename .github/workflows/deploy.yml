name: Build and deploy

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Build once, then promote: every push to main runs the tests, becomes three
# images (bot, blog, web) under one commit tag, and goes to staging. Production
# gets that tag only when someone runs promote.yml ("Promote to production")
# by hand: this repository is private, and GitHub's free plan offers no
# Required reviewers for it. Pull requests run the tests only.

jobs:
  test-bot:
    name: bot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # An empty environment, so no test passes only because the runner
      # happens to have a BOT_TOKEN.
      - run: env -i PATH="$PATH" HOME="$HOME" python -m pytest -q

  test-blog:
    name: blog tests
    runs-on: ubuntu-latest
    # The tests run on SQLite; production runs Postgres. Migrating a real
    # Postgres catches SQL that only one of them accepts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, pdo_sqlite, zip, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - name: Migrations run on Postgres
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: blog
          DB_USERNAME: blog
          DB_PASSWORD: blog
        run: php artisan migrate --force && php artisan migrate:rollback --force && php artisan migrate --force

  test-web:
    name: web typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # PageProps/LayoutProps are global types Next generates into .next/;
      # a fresh checkout has none until this runs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: [test-bot, test-blog, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      matrix:
        include:
          - image: bot
            context: bot
            file: bot/Dockerfile
          - image: blog
            context: blog
            file: blog/docker/prod/Dockerfile
          - image: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag and repo (lowercase - GHCR rejects mixed case)
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Builds on GitHub's runner, never on the VPS.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-staging:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: staging
      image_tag: ${{ needs.build-and-push.outputs.tag }}
    secrets: inherit
